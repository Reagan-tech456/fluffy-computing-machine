<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f5f8;
      margin: 0;
      padding: 25px;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 10px #cccccc;
    }
    h1 {
      text-align: center;
      color: #173b5e;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #bbbbbb;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      background-color: #173b5e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #2c638d;
    }
    #message {
      margin-top: 15px;
      color: green;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Registration Form</h1>

    <form id="registrationForm">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="admission">Admission Number</label>
      <input type="text" id="admission" name="admission" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="course">Select Course</label>
      <select id="course" name="course" required>
        <option value="">-- Choose Course --</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Business">Business</option>
      </select>

      <button type="submit">Register</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    // Get the form from the HTML page.
    const form = document.getElementById("registrationForm");

    // Run this code when the form is submitted.
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("fullname").value;

      document.getElementById("message").textContent =
        "Registration form completed for " + name + ".";

      form.reset();
    });
  </script>
</body>
</html>
